[package]
name = "saycmd"
version = "0.1.0"
edition = "2021"
description = "Translate tagged natural-language shell input into reviewable commands"
license = "MIT"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
dirs = "6"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "0.8"

[dev-dependencies]
tempfile = "3"

